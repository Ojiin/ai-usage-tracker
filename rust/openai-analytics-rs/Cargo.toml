[package]
name = "openai-analytics-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `openai_analytics.py`, generated by rust-anything"

[dependencies]
chrono = "0.4"
pycompat = { path = "../pycompat" }
serde = "1"
which = "8"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
