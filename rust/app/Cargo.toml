[package]
name = "tracker"
version = "0.1.0"
edition = "2024"
publish = false
description = "`tracker` in Rust, lifted by rust-anything from its front door"

[[bin]]
name = "tracker"
path = "src/main.rs"

[dependencies]
clap = "4"
tracker-rs = { path = "../tracker-rs" }
api-billing-rs = { path = "../api-billing-rs" }
openai-analytics-rs = { path = "../openai-analytics-rs" }
pycompat = { path = "../pycompat" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
open = "5"

[workspace]
