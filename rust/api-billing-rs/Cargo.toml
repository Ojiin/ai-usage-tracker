[package]
name = "api-billing-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `api_billing.py`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
pycompat = { path = "../pycompat" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "3", features = ["json"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
