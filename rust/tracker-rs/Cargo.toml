[package]
name = "tracker-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `tracker.py`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde = "1"
pycompat = { path = "../pycompat" }
indexmap = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
zstd = "0.13"
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
